# Mobilewright Tests (Android on CI)

# Based on: https://mobilewright.dev/docs/getting-started/ci
# Android emulator is started on the runner — NOT your USB phone.

name: Mobilewright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual run from GitHub → Actions → "Run workflow"
  workflow_dispatch:

jobs:
  android:
    name: Android emulator tests
    runs-on: ubuntu-latest

    steps:
      # 1) Download this repo onto the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Install Node (MobileWright needs Node >= 18; docs use 24)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3) Install npm dependencies from package-lock / package.json
      - name: Install dependencies
        run: npm ci

      # 4) KVM speeds up the Android emulator on Linux runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4android.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 5) Boot emulator → wait until ready → run MobileWright
      #    script: runs ONLY after the emulator is online
      - name: Run MobileWright on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: npx mobilewright test tests/wdioE2ETest.spec.ts --project=android --reporter html

      # 6) Upload HTML report even if tests failed
      - name: Upload MobileWright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobilewright-report-android
          path: mobilewright-report/
          retention-days: 30

