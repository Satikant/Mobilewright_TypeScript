# Mobilewright Tests (Android on CI)

# Based on: https://mobilewright.dev/docs/getting-started/ci
# Android emulator is started on the runner — NOT your USB phone.

name: Mobilewright Tests

on:
  push:
    branches: [main, featurebranch]
  pull_request:
    branches: [main]
  # Manual run from GitHub → Actions → "Run workflow"
  workflow_dispatch:

jobs:
  android:
    name: Android emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOBILEWRIGHT_DISABLE_TELEMETRY: '1'

    steps:
      # 1) Download this repo onto the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Install Node (MobileWright needs Node >= 18; docs use 24)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3) Install npm dependencies from package-lock / package.json
      - name: Install dependencies
        run: npm ci

      # 4) FIX: fast preflight (~5s) — fails on bad imports / zero tests
      #    BEFORE paying the cost of booting an emulator.
      - name: Preflight - discover tests
        run: npx mobilewright test --list

      # 5) FIX: the APK is git-ignored (124 MB > GitHub's 100 MB file limit),
      #    so fetch it at runtime. "PK" check guards against an HTML error page.
      - name: Download Android test app (wdio demo app)
        run: |
          mkdir -p testapps
          curl -fL --retry 3 -o testapps/AndroidWdio.apk \
            https://github.com/webdriverio/native-demo-app/releases/download/v2.2.0/android.wdio.native.app.v2.2.0.apk
          ls -lh testapps/AndroidWdio.apk
          test "$(head -c 2 testapps/AndroidWdio.apk)" = "PK"

      # 6) KVM speeds up the Android emulator on Linux runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4android.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 7) Boot emulator → wait until ready → run MobileWright
      #    FIX: -no-snapshot avoids the pointless snapshot save/restore in CI.
      #    FIX: DEBUG=mw:* prints the device-resolution trace to the job log.
      #
      #    WHY EVERY LINE IS FAIL-FAST:
      #    Mobilewright 0.0.51 hangs forever (no error, no timeout) when no connected
      #    device matches `deviceName`. Without the guards below, a mismatch silently
      #    burns the whole job: 3 tests x 2 attempts x test timeout. The guards turn
      #    that invisible failure into a clear message within seconds.
      #
      #    NOTE: the action runs each line with its own `sh -c`, so environment
      #    variables do NOT carry across lines. Anything needed later is set inline.
      - name: Run MobileWright on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            set -x
            adb devices -l
            # With DEVICE_MAX=1, adb exits 1 after printing the first device.
            # That is expected here, so ignore the exit code; || is never reached.
            DEVICE=$(adb devices | awk '$2=="device"{print $1; exit}' || true)
            echo "RESOLVED_DEVICE=$DEVICE"
            test -n "$DEVICE"
            # Print the name Mobilewright will match deviceName against.
            adb -s "$DEVICE" shell getprop ro.boot.qemu.avd_name
            adb -s "$DEVICE" shell getprop ro.product.model
            # Pre-install the agent here so the hard 8-minute cap protects the
            # fixture setup, which otherwise blocks with no output.
            timeout 480 npx mobilewright install
            npx mobilewright devices
            DEBUG='mw:*' npx mobilewright test tests/wdioE2ETest.spec.ts --project=android

      # 8) Upload HTML report even if tests failed
      - name: Upload MobileWright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobilewright-report-android
          path: |
            mobilewright-report/
            allure-results/
          retention-days: 30
          if-no-files-found: warn

  # Optional later: iOS needs macos-latest + simulator + iOS app zip in the repo.
